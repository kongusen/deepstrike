name: Release Rust Crates

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    uses: ./.github/workflows/_verify-version.yml

  gate:
    # Grant the reusable gate exactly what it needs to poll the Actions API.
    # Without this, the repo's default token (actions: none) rejects the call.
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_gate-ci.yml

  publish:
    needs: [verify, gate]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Dry-run publish check (tokenizer)
        run: cargo publish -p deepstrike-tokenizer --dry-run --allow-dirty

      - name: Publish deepstrike-tokenizer
        run: cargo publish -p deepstrike-tokenizer

      - name: Wait for deepstrike-tokenizer in crates.io index
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          for i in $(seq 1 12); do
            if cargo info "deepstrike-tokenizer@$VERSION" >/dev/null 2>&1; then
              echo "deepstrike-tokenizer $VERSION is indexed"
              exit 0
            fi
            echo "Waiting for deepstrike-tokenizer index... attempt $i/12"
            if [ "$i" -lt 12 ]; then sleep 15; fi
          done
          echo "::error::deepstrike-tokenizer $VERSION was not indexed in time"
          exit 1

      - name: Dry-run publish check (core)
        run: cargo publish -p deepstrike-core --dry-run --allow-dirty

      - name: Publish deepstrike-core
        run: cargo publish -p deepstrike-core

      - name: Wait for deepstrike-core in crates.io index
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          for i in $(seq 1 12); do
            if cargo info "deepstrike-core@$VERSION" >/dev/null 2>&1; then
              echo "deepstrike-core $VERSION is indexed"
              exit 0
            fi
            echo "Waiting for deepstrike-core index... attempt $i/12"
            if [ "$i" -lt 12 ]; then sleep 15; fi
          done
          echo "::error::deepstrike-core $VERSION was not indexed in time"
          exit 1

      - name: Dry-run publish check (sdk)
        run: cargo publish -p deepstrike-sdk --dry-run --allow-dirty

      - name: Publish deepstrike-sdk
        run: cargo publish -p deepstrike-sdk
