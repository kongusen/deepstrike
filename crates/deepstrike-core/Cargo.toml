[package]
name = "deepstrike-core"
description = "Cross-language agent runtime kernel — pure computation, zero I/O"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
compact_str = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
deepstrike-tokenizer = { workspace = true }

[dev-dependencies]
pretty_assertions = "1"

# P7-S5 · chain validator CLI (P2 §5 batch 1: C1–C4 + C7). Host-ops tooling with its own
# release rhythm (P7 §3.1: tool nature — does not gate SDK versions).
[[bin]]
name = "ds-chain-validator"
path = "src/bin/ds-chain-validator.rs"

[[bin]]
name = "deepstrike"
path = "src/bin/deepstrike.rs"

[[bench]]
name = "kernel_baseline"
harness = false

[[bench]]
name = "wait_index_baseline"
harness = false

[[bench]]
name = "verifiable_baseline"
harness = false
