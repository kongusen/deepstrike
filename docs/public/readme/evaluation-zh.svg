<text x="535" y="384" font-size="29" fill="#80d7d0">EvaluationContextBinding</text>
<text x="535" y="431" font-size="20" fill="#adb9ae">引用纳入应用提供的评估证据</text>
<text x="535" y="472" font-size="20" fill="#adb9ae">+ 可选的缓存前缀</text>
<text x="42" y="569" font-size="21" fill="#b8afff">ArtifactSet 的版本沿革在 operation genesis 单独绑定。</text>
<text x="42" y="610" font-size="18" fill="#adb9ae">验证范围包括绑定完整性与证据覆盖，答案质量仍由你的评估标准判断。</text>
