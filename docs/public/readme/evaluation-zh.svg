<text x="42" y="43" font-size="15" fill="#b9e77a">DEEPSTRIKE  /  RUNTIME NOTES  /  0.2.70</text>
<text x="42" y="99" font-size="34" fill="#f4f1e8">这次评估，究竟评了什么？</text>
<text x="42" y="136" font-size="19" fill="#adb9ae">EvaluationContextBinding 将评估关联到实际执行的上下文输入。</text>
