<polygon points="496,466 487.22417438109625,470.79425538604204 487.22417438109625,461.20574461395796" fill="#80d7d0"/>
<rect x="507" y="184" width="651" height="330" rx="18" fill="#1c2520" stroke="#80d7d0" stroke-width="2"/>
<text x="535" y="241" font-size="30" fill="#f4f1e8">ContextExecutionInput</text>
