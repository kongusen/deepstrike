<text x="42" y="610" font-size="22" fill="#ffbb85">运行中的任务保留原 ArtifactSet，激活从下一次任务边界开始。</text>
<text x="42" y="651" font-size="19" fill="#adb9ae">评估为决定提供证据；评估本身不授予激活权限。</text>
